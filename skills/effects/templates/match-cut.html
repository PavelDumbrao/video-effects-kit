<template>
<style>

#__ID__-all{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:0}
.__ID__-s{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;opacity:0}

.__ID__-m{position:absolute;left:44px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:44px;color:#4ADE80;white-space:nowrap}

</style>
<div id="root" data-composition-id="__ID__" data-start="0" data-duration="@@DUR@@" data-width="1080" data-height="1920">
 <div id="__ID__-clip" class="clip" data-start="0" data-duration="@@DUR@@" style="position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden">
  <div id="__ID__-all">

   <div class="__ID__-s" id="__ID__-s0">
    <div class="__ID__-m" id="__ID__-s0-path" style="top:190px;color:#86EFAC">~/my_reels/</div>
    <div class="__ID__-h" id="__ID__-s0-b" style="font-weight:900;color:#fff"></div>
    <div class="__ID__-h" id="__ID__-s0-a" style="font-weight:900;color:#fff"></div>
    <i id="__ID__-s0-cur" style="position:absolute;left:44px;top:1706px;width:16px;height:30px;background:#4ADE80"></i>
   </div>

   <div class="__ID__-s" id="__ID__-s1">
    <div class="__ID__-c" id="__ID__-s1-name" style="top:190px;font-weight:900;letter-spacing:.14em;line-height:80px">ФОНАРЬ</div>
    <div style="position:absolute;left:60px;top:280px;width:960px;height:4px;background:#1b1b1b"></div>
    <div style="position:absolute;left:60px;top:288px;width:960px;height:2px;background:#1b1b1b"></div>
    <img class="__ID__-ph" id="__ID__-s1-ph" src="@@F3@@" alt="" style="left:60px;width:960px;border:3px solid #1b1b1b">
    <div class="__ID__-h" id="__ID__-s1-b" style="font-weight:900"></div>
    <div class="__ID__-h" id="__ID__-s1-a" style="font-weight:900"></div>
    <div style="position:absolute;left:60px;top:1690px;width:960px;height:3px;background:#1b1b1b"></div>
    <div class="__ID__-c __ID__-e" id="__ID__-s1-cap" style="top:1706px;font-family:'Inter',sans-serif;font-size:28px;line-height:36px;color:#555"></div>
   </div>

   <div class="__ID__-s" id="__ID__-s2">
    <div style="position:absolute;left:0;top:0;width:1080px;height:330px;background:#D61F26"></div>
    <div class="__ID__-c" id="__ID__-s2-name" style="top:200px;font-weight:900;letter-spacing:.12em;color:#fff;line-height:110px">СИГНАЛ</div>
    <div class="__ID__-c __ID__-e" id="__ID__-s2-rub" style="top:346px;font-size:28px;font-weight:700;letter-spacing:.1em;color:#D61F26;line-height:36px"></div>
    <img class="__ID__-ph" id="__ID__-s2-p1" src="@@F4@@" alt="" style="left:40px;width:490px;border-radius:6px">
    <img class="__ID__-ph" id="__ID__-s2-p2" src="@@F6@@" alt="" style="left:550px;width:490px;border-radius:6px">
    <div class="__ID__-h" id="__ID__-s2-b" style="font-weight:900"></div>
    <div class="__ID__-h" id="__ID__-s2-a" style="font-weight:900"></div>
    <div style="position:absolute;left:0;top:1740px;width:1080px;height:180px;background:#D61F26"></div>
   </div>

   <div class="__ID__-s" id="__ID__-s3">
    <div class="__ID__-c" id="__ID__-s3-name" style="top:190px;font-weight:700;font-style:italic;line-height:76px">Утренняя схема</div>
    <div style="position:absolute;left:80px;top:280px;width:920px;height:3px;background:#2b1d12"></div>
    <div id="__ID__-s3-chips" style="position:absolute;left:100px;width:880px;height:76px;display:flex;gap:14px;justify-content:center">
     <i style="display:block;width:104px;height:76px;border-radius:10px;background:#C2410C"></i><i style="display:block;width:104px;height:76px;border-radius:10px;background:#D97757"></i><i style="display:block;width:104px;height:76px;border-radius:10px;background:#E0457B"></i><i style="display:block;width:104px;height:76px;border-radius:10px;background:#7C3AED"></i><i style="display:block;width:104px;height:76px;border-radius:10px;background:#2563EB"></i><i style="display:block;width:104px;height:76px;border-radius:10px;background:#16A34A"></i><i style="display:block;width:104px;height:76px;border-radius:10px;background:#CA8A04"></i>
    </div>
    <div class="__ID__-h" id="__ID__-s3-b" style="font-weight:900"></div>
    <div class="__ID__-h" id="__ID__-s3-a" style="font-weight:900"></div>
    <div style="position:absolute;left:80px;top:1690px;width:920px;height:3px;background:#2b1d12"></div>
   </div>

   <div class="__ID__-s" id="__ID__-s4">
    <div style="position:absolute;left:60px;top:190px;display:flex;align-items:center;gap:18px">
     <span style="display:flex;align-items:center;justify-content:center;width:72px;height:72px;border-radius:16px;background:#6D28D9;flex:none"><svg width="44" height="44" viewBox="0 0 100 100" style="flex:none;display:block"><g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"><line x1="50" y1="8" x2="50" y2="92" transform="rotate(0 50 50)"/><line x1="50" y1="8" x2="50" y2="92" transform="rotate(45 50 50)"/><line x1="50" y1="8" x2="50" y2="92" transform="rotate(90 50 50)"/><line x1="50" y1="8" x2="50" y2="92" transform="rotate(135 50 50)"/></g></svg></span>
     <span id="__ID__-s4-name" style="font-size:48px;font-weight:900;line-height:72px;white-space:nowrap">Tech-вестник</span>
    </div>
    <div id="__ID__-s4-tag" style="position:absolute;left:60px;top:282px;padding:0 20px;height:48px;line-height:48px;border-radius:24px;background:#EDE9FE;color:#6D28D9;font-size:28px;font-weight:700;white-space:nowrap"></div>
    <div id="__ID__-s4-term" style="position:absolute;left:60px;width:960px;border-radius:16px;background:#14122b;padding:22px 28px;font-family:'JetBrains Mono',monospace;font-size:30px;line-height:44px;color:#C4B5FD;white-space:nowrap;overflow:hidden"></div>
    <div class="__ID__-h" id="__ID__-s4-b" style="font-weight:900"></div>
    <div class="__ID__-h" id="__ID__-s4-a" style="font-weight:900"></div>
    <div class="__ID__-c __ID__-e" id="__ID__-s4-cap" style="top:1706px;font-size:28px;line-height:36px;color:#666"></div>
   </div>

   <div id="__ID__-w"><span id="__ID__-ws">Claude</span></div>
  </div>
 </div>
</div>
<script>
(function(){
 const P=/*@@P@@*/{};
 const tl=gsap.timeline({paused:true});
 const D=P.dur, F=P.face;
 const g=id=>document.getElementById('__ID__-'+id);
 const px=v=>Math.round(v)+'px';
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

 // Слово: один элемент над всеми полосами, поэтому точка и размер одни на всех кадрах.
 const word=(P.word==null||String(P.word).trim()==='')?'Claude':String(P.word).trim();
 const wn=[...word].length;
 const fsW=clamp(Math.floor(916/(wn*0.68)),44,100);
 const lhW=Math.round(fsW*1.25), hw=Math.round(lhW/2);
 const wordW=Math.min(960,wn*fsW*0.66+48);
 const chin=F.y+F.h;
 const Y=clamp(Math.round(chin+130),900,1400);
 const wbox=g('w'), wsp=g('ws');
 wsp.textContent=word; wsp.style.fontSize=fsW+'px'; wsp.style.lineHeight=lhW+'px';
 wbox.style.top=px(Y-hw); wbox.style.height=lhW+'px';

 // Тексты заголовков: до слова (прижат вниз к слову), после слова (под ним).
 const heads=Array.isArray(P.headlines)?P.headlines:[];
 const papers=Array.isArray(P.papers)?P.papers:[];
 const headOf=i=>{const h=heads.length?(heads[i]||heads[i%heads.length]||{}):{};return{b:String(h.before==null?'':h.before).trim(),a:String(h.after==null?'':h.after).trim()};};
 const paperOf=(i,d)=>{const s=papers[i];return (s==null||String(s).trim()==='')?d:String(s).trim();};

 const GAP=24, TOP0=190, MAST_MIN=200, TXT_BOT=1620, DEC_BOT=1670;
 const bBottom=Y-hw-GAP, aTop=Y+hw+GAP;
 const colW=Math.round(clamp(wordW+240,780,960));
 const colL=Math.round((1080-colW)/2);
 const maxFs=Math.min(76,Math.round(fsW*0.78));
 const CW=0.66;

 function est(text,fs){
  const ws=text.split(/\s+/).filter(Boolean); let lines=1,cur=0; const sp=fs*0.28;
  for(const w of ws){
   const wl=[...w].length*fs*CW;
   if(wl>colW){ if(cur>0){lines++;cur=0;} const extra=Math.ceil(wl/colW)-1; lines+=extra; cur=wl-extra*colW; continue; }
   if(cur===0) cur=wl; else if(cur+sp+wl<=colW) cur+=sp+wl; else {lines++;cur=wl;}
  }
  return lines;
 }
 function fit(text,avail,maxLines){
  if(!text) return {fs:36,lh:0,lines:0,h:0};
  for(let fs=maxFs;fs>=36;fs-=2){
   const lh=Math.round(fs*1.14), n=est(text,fs);
   if(n<=maxLines&&n*lh<=avail) return {fs,lh,lines:n,h:n*lh};
  }
  const lh=41, lines=Math.max(1,Math.min(maxLines,Math.floor(avail/lh)));
  return {fs:36,lh,lines,h:lines*lh};
 }
 function setHead(el,text,f,anchor){
  if(!text){ el.style.display='none'; return; }
  el.textContent=text;
  el.style.left=px(colL); el.style.width=colW+'px';
  el.style.fontSize=f.fs+'px'; el.style.lineHeight=f.lh+'px';
  el.style.maxHeight=f.h+'px'; el.style.webkitLineClamp=String(f.lines);
  if(anchor==='b') el.style.bottom=px(1920-bBottom); else el.style.top=px(aTop);
 }
 // Свободное место под вставку: сверху (между шапкой и «до») или снизу (между «после» и низом); сверху в приоритете.
 function slot(from1,to1,from2,to2,minH,maxH){
  const g1=to1-from1, g2=to2-from2;
  if(g1>=minH){const h=Math.min(g1,maxH);return{y:Math.round(from1+(g1-h)/2),h,bottom:false};}
  if(g2>=minH){const h=Math.min(g2,maxH);return{y:Math.round(from2+(g2-h)/2),h,bottom:true};}
  return null;
 }
 // Серые полоски вместо колонок текста: заполняют пустую нижнюю часть полосы, как набор в газете.
 const PAT=[100,94,98,88,100,72,96,90,100,64,97,86,100,78];
 function bars(strip,from,to,color){
  const rows=Math.min(14,Math.floor((to-from+18)/32));
  if(rows<2) return;
  const box=document.createElement('div');
  box.style.cssText='position:absolute;left:60px;width:960px';
  box.style.top=px(from); box.style.height=px(rows*32-18);
  for(let c=0;c<2;c++){
   const col=document.createElement('div');
   col.style.cssText='position:absolute;top:0;width:462px;left:'+(c?498:0)+'px';
   for(let r=0;r<rows;r++){
    const b=document.createElement('i');
    const w=PAT[(r+c*5)%PAT.length];
    b.style.cssText='position:absolute;left:0;height:14px;border-radius:7px;top:'+(r*32)+'px;width:'+w+'%;background:'+color;
    col.appendChild(b);
   }
   box.appendChild(col);
  }
  strip.appendChild(box);
 }
 function plan(i){
  const hd=headOf(i);
  const bf=fit(hd.b,bBottom-(TOP0+MAST_MIN+20),4);
  const af=fit(hd.a,TXT_BOT-aTop,3);
  setHead(g('s'+i+'-b'),hd.b,bf,'b');
  setHead(g('s'+i+'-a'),hd.a,af,'a');
  return{
   topTo:bBottom-(hd.b?bf.h:0)-20,
   botFrom:aTop+(hd.a?af.h:0)+20
  };
 }
 const list=v=>(Array.isArray(v)?v:[]).map(x=>String(x==null?'':x).trim()).filter(x=>x.length);
 const one=v=>(v==null?'':String(v).trim());
 const terminal=list(P.terminal), caps=Array.isArray(P.captions)?P.captions:[];
 function fillText(el,t,maxFs,minFs,avail,k){
  if(!t){ el.style.display='none'; return; }
  el.textContent=t; el.style.fontSize=clamp(Math.floor(avail/([...t].length*k)),minFs,maxFs)+'px';
 }
 const sizeBy=(len,avail,k,mn,mx)=>clamp(Math.floor(avail/(Math.max(1,len)*k)),mn,mx);

 // 1 терминал
 (function(){
  const pl=plan(0);
  const path=g('s0-path'); const name=one(papers[0]); path.textContent=name.charAt(0)==='~'?name:'~/'+name;
  if(!name) path.style.display='none';
  const strip=g('s0'), CHECK='<svg width="30" height="30" viewBox="0 0 24 24" style="vertical-align:-4px;margin-right:10px"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#4ADE80" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  terminal.forEach((line,k)=>{
   const y=244+k*44;
   if(y+44>pl.topTo) return;
   const r=document.createElement('div'); r.className='__ID__-m'; r.style.top=px(y);
   if(k===terminal.length-1){ r.style.color='#fff'; r.innerHTML=CHECK; }
   r.appendChild(document.createTextNode(line));
   strip.appendChild(r);
  });
  if(!terminal.length) g('s0-cur').style.display='none';
  bars(g('s0'),pl.botFrom,1660,'#2a2a2a');
 })();

 // 2 фонарь
 (function(){
  const pl=plan(1);
  const nm=g('s1-name'); const t=paperOf(1,'ФОНАРЬ'); nm.textContent=t;
  nm.style.fontSize=sizeBy([...t].length,960,0.95,32,66)+'px';
  fillText(g('s1-cap'),one(caps[0]),28,28,960,1);
  const ph=g('s1-ph'); const s=slot(310,pl.topTo,pl.botFrom,DEC_BOT,180,380);
  if(s){ph.style.top=px(s.y);ph.style.height=px(s.h);} else ph.style.display='none';
  if(!(s&&s.bottom)) bars(g('s1'),pl.botFrom,1660,'rgba(27,27,27,.16)');
 })();

 // 3 сигнал
 (function(){
  const pl=plan(2);
  const nm=g('s2-name'); const t=paperOf(2,'СИГНАЛ'); nm.textContent=t;
  nm.style.fontSize=sizeBy([...t].length,960,0.95,32,60)+'px';
  fillText(g('s2-rub'),one(P.rubric),28,28,960,1.0);
  const s=slot(406,pl.topTo,pl.botFrom,DEC_BOT,160,340);
  ['s2-p1','s2-p2'].forEach(id=>{const p=g(id); if(s){p.style.top=px(s.y);p.style.height=px(s.h);} else p.style.display='none';});
  if(!(s&&s.bottom)) bars(g('s2'),pl.botFrom,1700,'rgba(17,17,17,.14)');
 })();

 // 4 утренняя схема
 (function(){
  const pl=plan(3);
  const nm=g('s3-name'); const t=paperOf(3,'Утренняя схема'); nm.textContent=t;
  nm.style.fontSize=sizeBy([...t].length,960,0.6,32,60)+'px';
  const ch=g('s3-chips'); const s=slot(300,pl.topTo,pl.botFrom,DEC_BOT,96,96);
  if(s) ch.style.top=px(s.y); else ch.style.display='none';
  if(!(s&&s.bottom)) bars(g('s3'),pl.botFrom,1660,'rgba(43,29,18,.16)');
 })();

 // 5 вестник
 (function(){
  const pl=plan(4);
  const nm=g('s4-name'); const t=paperOf(4,'Tech-вестник'); nm.textContent=t;
  nm.style.fontSize=sizeBy([...t].length,820,0.66,28,48)+'px';
  const tg=g('s4-tag'), tgt=one(P.tag); if(tgt) tg.textContent=tgt; else tg.style.display='none';
  fillText(g('s4-cap'),one(caps[1]),28,28,960,1);
  const cmds=terminal.slice(0,-1).slice(0,3);
  const tm=g('s4-term'); const th=cmds.length*44+44;
  const s=cmds.length?slot(346,pl.topTo,pl.botFrom,DEC_BOT,th,th):null;
  if(s){
   tm.style.top=px(s.y); tm.style.height=th+'px';
   cmds.forEach((c,k)=>{const d=document.createElement('div'); d.textContent=c; if(k) d.style.color='#4ADE80'; tm.appendChild(d);});
  } else tm.style.display='none';
  if(!(s&&s.bottom)) bars(g('s4'),pl.botFrom,1660,'rgba(20,18,43,.12)');
 })();

 // Время: полосы режутся жёстко; когда слово прозвучало в речи, полосы уходят на нём, иначе за 0,7 с до конца.
 const norm=s=>String(s).toLowerCase().replace(/[^a-zа-яё0-9]/g,'');
 const nw=norm(word);
 let tEnd=D-0.7;
 (P.words||[]).some(w=>{
  const a=norm(w.w);
  const ok=a&&nw&&(a===nw||(a.length>=5&&nw.length>=5&&a.slice(0,5)===nw.slice(0,5)));
  if(ok&&w.s>=1.0&&w.s<=D-0.55){tEnd=w.s;return true;}
  return false;
 });
 const ids=['#__ID__-s0','#__ID__-s1','#__ID__-s2','#__ID__-s3','#__ID__-s4'];
 tl.set(ids,{opacity:0},0);
 const n=Math.max(2,Math.round(tEnd/0.18)), step=tEnd/n;
 let prev=null;
 for(let i=0;i<n;i++){
  const t=i*step, cur=ids[i%5];
  if(prev) tl.set(prev,{opacity:0},t);
  tl.set(cur,{opacity:1},t);
  prev=cur;
 }
 tl.set(prev,{opacity:0},tEnd);

 // Вход: первые 0,12 с кадр проявляется; слово остаётся на видео и гаснет в последние 0,25 с.
 tl.fromTo('#__ID__-all',{opacity:0},{opacity:1,duration:0.12,ease:'power2.in'},0);
 tl.fromTo('#__ID__-ws',{boxShadow:'0 0 0 0 rgba(0,0,0,0)'},{boxShadow:'0 10px 30px rgba(0,0,0,.35)',duration:0.3,immediateRender:false},tEnd);
 tl.fromTo('#__ID__-ws',{scale:1},{scale:1.06,duration:0.1,ease:'power2.out',immediateRender:false},tEnd);
 tl.to('#__ID__-ws',{scale:1,duration:0.2,ease:'power2.inOut'},tEnd+0.1);
 tl.fromTo('#__ID__-w',{opacity:1},{opacity:0,duration:0.25,ease:'power2.out',immediateRender:false},D-0.25);

 window.__timelines=window.__timelines||{}; window.__timelines['__ID__']=tl;
})();
</script>
</template>
